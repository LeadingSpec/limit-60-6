<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Часовой лимит 60/6 — рабочая панель</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--acc:#2563eb}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111827;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:17px}header .demo{background:#374151;border-radius:8px;padding:3px 10px;font-size:12px;color:#d1d5db}
nav{display:flex;gap:4px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--mut)}
nav button.on{background:#eef2ff;color:var(--acc);font-weight:600}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kpi{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .n{font-size:26px;font-weight:700}.kpi .l{font-size:12px;color:var(--mut)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:2px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:center}
td input{width:52px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;font:inherit}
td input:focus{outline:2px solid #bfdbfe;border-color:var(--acc)}
.btn{border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);color:#fff}.btn.s{background:#eef2ff;color:var(--acc)}.btn.g{background:#f3f4f6;color:var(--ink)}
.btn:hover{filter:brightness(.96)}
input[type=text],input[type=tel],input[type=number],select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.bar{display:flex;align-items:flex-end;gap:6px;height:120px;margin:10px 0}
.bar>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar .b{width:100%;border-radius:6px 6px 0 0;background:#93c5fd;min-height:3px}
.bar .b.over{background:#ef4444}.bar .c{font-size:11px;color:var(--mut)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin-bottom:10px;font-size:14px}
.alert.red{background:#fef2f2;border:1px solid #fecaca}.alert.yel{background:#fffbeb;border:1px solid #fde68a}
.alert .ic{font-size:18px}
.mut{color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.jr{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
.big{font-size:20px;font-weight:700}
.phone{max-width:360px;margin:0 auto;border:10px solid #111827;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.phone .ph-head{background:#111827;color:#fff;padding:14px 16px;font-weight:700}
.phone .ph-body{padding:16px}
.hint{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:10px 14px;font-size:13px;color:#3730a3;margin-bottom:14px}
@media print{header,nav,.btn,#toast,.noprint{display:none!important}body{background:#fff}.card{border:0}}
</style></head><body>
<header><b>⏰ Часовой лимит · 60/6</b> <span class="demo">рабочая панель · демо-данные</span>
<span style="margin-left:auto;font-size:12px;color:#9ca3af">данные хранятся локально в этом браузере</span></header>
<nav id="nav"></nav><main id="view"></main><div id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const MONTHS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function addMonths(k,n){const[y,m]=k.split('-').map(Number);let M=m-1+n;const Y=y+Math.floor(M/12);M=((M%12)+12)%12;return Y+'-'+String(M+1).padStart(2,'0');}
function label(k){const[y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+String(y).slice(2);}
function curMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthWindow(n){const CM=curMonth();const a=[];for(let i=n-1;i>=0;i--)a.push(addMonths(CM,-i));return a;}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}
const STATUS={
 safe:{t:'Безопасно',fg:'#15803d',bg:'#dcfce7'},
 warn:{t:'Внимание',fg:'#b45309',bg:'#fef3c7'},
 crit:{t:'На грани',fg:'#b91c1c',bg:'#fee2e2'},
 triggered:{t:'Лимит сработал',fg:'#991b1b',bg:'#fecaca'},
 paused:{t:'Пауза 60/6',fg:'#57534e',bg:'#e7e5e4'}};
function badge(st){const s=STATUS[st];return '<span class="badge" style="color:'+s.fg+';background:'+s.bg+'">'+s.t+'</span>';}

/* ---------- состояние ---------- */
const KEY='hr60_v1';
const DEF={limit:60,seriesLen:6,pauseMonths:2};
let S=null;
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function uid(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function seed(){
 const CM=curMonth(),M=n=>addMonths(CM,n);
 const mk=(a,b,c,d,e,f,g)=>({[M(-7)]:a||'', [M(-6)]:b||'',[M(-5)]:c||'',[M(-4)]:d||'',[M(-3)]:e||'',[M(-2)]:f||'',[M(-1)]:g||''});
 S={version:1,settings:{...DEF},journal:[],executors:[
  {id:uid(),code:'A7K2',name:'Иванов И. И.',phone:'+7 911 100-11-22',platform:'Яндекс Смена · СтройПодряд',payouts:mk(42000,45000,48000,46000,47000,44000,41000),hours:mk(48,66,68,70,65,64,61)},
  {id:uid(),code:'M3P9',name:'Петрова А. С.',phone:'+7 911 100-33-44',platform:'Авито Подработки · СтройПодряд',payouts:mk(38000,39500,41000,40000,40500,39000,38500),hours:mk(30,55,63,65,64,66,62)},
  {id:uid(),code:'K4T8',name:'Козлова М. В.',phone:'+7 911 100-55-66',platform:'КлинингПро · Клининг',payouts:mk(28000,31000,30000,12000,22000,26000,25000),hours:mk(52,64,66,61,40,62,60)},
  {id:uid(),code:'D1R6',name:'Сидоров П. Н.',phone:'+7 911 100-77-88',platform:'Яндекс Смена · Склад №2',payouts:mk(21000,22000,23000,21000,24000,22000,23000),hours:mk(44,50,48,52,55,50,54)},
  {id:uid(),code:'V8L2',name:'Кузнецов Д. А.',phone:'+7 911 100-99-00',platform:'Доставка Еда · Общепит',payouts:mk(18000,19000,25000,27000,26000,25500,26500),hours:mk(38,40,66,70,64,71,0)} ],
  journal:[{ts:new Date().toISOString(),txt:'Загружены демо-данные (5 исполнителей)'}]};
 save();}
function load(){try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null;}if(!S||!S.executors)seed();}
function jlog(txt){S.journal.unshift({ts:new Date().toISOString(),txt});if(S.journal.length>200)S.journal.length=200;save();}

/* ---------- расчётное ядро 60/6 ---------- */
function calcLink(ex){
 const Sx=S.settings;
 const months=Object.keys(ex.hours||{}).sort();
 const r={series:0,status:'safe',triggerMonth:null,pausedUntil:null,resetMonth:null,forecast:null};
 if(!months.length)return r;
 let series=0,pauseUntil=null,triggeredMonth=null;
 for(const m of months){
  if(pauseUntil){if(m<=pauseUntil)continue;pauseUntil=null;series=0;}
  const h=+ex.hours[m]||0;
  if(h>Sx.limit){series++;
   if(series>=Sx.seriesLen){triggeredMonth=m;pauseUntil=addMonths(m,Sx.pauseMonths);series=0;}
  }else{series=0;r.resetMonth=m;}
 }
 r.series=series;r.triggerMonth=triggeredMonth;r.pausedUntil=pauseUntil;
 const cur=months[months.length-1],hcur=+ex.hours[cur]||0;
 if(pauseUntil){
  r.status=triggeredMonth===cur?'triggered':'paused';
  r.forecast='расчёт возобновится с '+label(addMonths(pauseUntil,1));
 }else if(series>=Sx.seriesLen-1){
  r.status='crit';r.forecast='при темпе >'+Sx.limit+' ч сработает в '+label(addMonths(cur,1));
 }else if(series>=Sx.seriesLen-2){
  r.status='warn';
  r.forecast=hcur>Sx.limit?('при темпе >'+Sx.limit+' ч сработает в '+label(addMonths(cur,Sx.seriesLen-series)))
   :('если снова >'+Sx.limit+' ч — сработает в '+label(addMonths(addMonths(cur,1),Sx.seriesLen-1)));
 }else{
  r.status='safe';
  r.forecast=hcur>Sx.limit?('при темпе >'+Sx.limit+' ч сработает в '+label(addMonths(cur,Sx.seriesLen-series))):'риска нет';
 }
 return r;}
function payoutRisk(ex){ // упрощённый индикатор дохода (25 тыс. ₽ × 5 мес подряд)
 const months=Object.keys(ex.payouts||{}).sort();let s=0,best=0;
 for(const m of months){const p=+ex.payouts[m]||0;if(p>=25000){s++;if(s>best)best=s;}else s=0;}
 return best;}
const RANK={triggered:0,paused:1,crit:2,warn:3,safe:4};

/* ---------- навигация ---------- */
const TABS=[['dash','Панель'],['execs','Исполнители'],['exec','Страница исполнителя'],['calc','Калькулятор'],['set','Настройки']];
let tab='dash',openId=null,execCode=null;
function renderNav(){
 $('#nav').innerHTML=TABS.map(t=>'<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('');}
function go(t,arg){tab=t;if(arg!==undefined)openId=arg;renderNav();render();}
function render(){
 const v=$('#view');
 if(tab==='dash')v.innerHTML=viewDash();
 else if(tab==='execs')v.innerHTML=viewExecs();
 else if(tab==='exec')v.innerHTML=viewExecPage();
 else if(tab==='calc')v.innerHTML=viewCalc();
 else v.innerHTML=viewSet();
 const h=typeof afterRender==='function'?afterRender:null;afterRender=null;if(h)h();}
let afterRender=null;

/* ---------- панель заказчика ---------- */
function viewDash(){
 const CM=curMonth();
 const rows=S.executors.map(ex=>({ex,c:calcLink(ex)}));
 rows.sort((a,b)=>RANK[a.c.status]-RANK[b.c.status]||b.c.series-a.c.series);
 const cnt={safe:0,warn:0,crit:0,triggered:0,paused:0};rows.forEach(r=>cnt[r.c.status]++);
 let alerts='';
 rows.forEach(r=>{const c=r.c;
  if(c.status==='crit')alerts+='<div class="alert red"><span class="ic">🚨</span><div><b>'+r.ex.name+'</b> — '+c.series+'-й месяц подряд выше лимита. При текущем темпе приостановка в '+label(addMonths(CM,1))+'. Рекомендация: снизить часы в '+label(CM).replace(' '+CM.slice(2),'')+' или распределить по другому заказчику.</div></div>';
  if(c.status==='warn')alerts+='<div class="alert yel"><span class="ic">⚠️</span><div><b>'+r.ex.name+'</b> — '+c.series+'-й месяц подряд. '+c.forecast+'. Пора готовить план на '+label(addMonths(CM,1))+'.</div></div>';
  if(c.status==='triggered')alerts+='<div class="alert red"><span class="ic">⛔</span><div><b>'+r.ex.name+'</b> — лимит сработал в '+label(CM)+'. Пауза 2 месяца, заказы через платформу приостановлены. Варианты: перераспределить объём, оформить ГПД напрямую, взять объём на себя.</div></div>';
 });
 const tbl='<table><tr><th>Исполнитель</th><th>Платформа · заказчик</th>'+monthWindow(8).map(m=>'<th class="num">'+label(m)+'</th>').join('')+'<th>Серия</th><th>Статус</th><th>Прогноз</th></tr>'
 +rows.map(r=>{const ex=r.ex,c=r.c;const tds=monthWindow(8).map(m=>{const h=ex.hours[m];const v=(h===''||h==null)?'':(+h>S.settings.limit?'<b style="color:#b91c1c">'+h+'</b>':h);return '<td class="num">'+(v||'–')+'</td>';}).join('');
  return '<tr style="cursor:pointer" onclick="go(\'execs\',\''+ex.id+'\')"><td><b>'+ex.name+'</b></td><td class="mut">'+ex.platform+'</td>'+tds+'<td class="num"><b>'+c.series+'/'+S.settings.seriesLen+'</b></td><td>'+badge(c.status)+'</td><td class="mut">'+(c.forecast||'—')+'</td></tr>';}).join('')+'</table>';
 return '<div class="kpis">'
 +'<div class="kpi"><div class="n">'+S.executors.length+'</div><div class="l">исполнителей</div></div>'
 +'<div class="kpi"><div class="n" style="color:#b91c1c">'+(cnt.crit+cnt.triggered)+'</div><div class="l">на грани / сработал</div></div>'
 +'<div class="kpi"><div class="n" style="color:#b45309">'+cnt.warn+'</div><div class="l">на предупреждении</div></div>'
 +'<div class="kpi"><div class="n" style="color:#15803d">'+cnt.safe+'</div><div class="l">безопасно</div></div></div>'
 +(alerts||'<div class="card mut">Открытых алертов нет — все счётчики под контролем.</div>')
 +'<div class="card"><div class="big" style="margin-bottom:8px">Реестр связок · '+label(CM)+'</div>'+tbl+'</div>';
}

/* ---------- исполнители ---------- */
function viewExecs(){
 if(openId){const ex=S.executors.find(e=>e.id===openId);if(ex)return viewDetail(ex);openId=null;}
 const CM=curMonth();
 const rows=S.executors.map(ex=>({ex,c:calcLink(ex)})).sort((a,b)=>RANK[a.c.status]-RANK[b.c.status]);
 const tbl='<table><tr><th>Исполнитель</th><th>Код входа</th><th>Платформа · заказчик</th>'+monthWindow(6).map(m=>'<th class="num">'+label(m)+'</th>').join('')+'<th>Статус</th></tr>'
 +rows.map(r=>{const tds=monthWindow(6).map(m=>'<td class="num"><input type="number" min="0" max="400" value="'+(r.ex.hours[m]??'')+'" onchange="setHours(\''+r.ex.id+'\',\''+m+'\',this.value)"></td>').join('');
  return '<tr><td><b>'+r.ex.name+'</b><div class="mut">'+r.ex.phone+'</div></td><td><code>'+r.ex.code+'</code></td><td class="mut">'+r.ex.platform+'</td>'+tds+'<td>'+badge(r.c.status)+'</td></tr>';}).join('')+'</table>';
 return '<div class="hint">Часы можно вводить прямо в таблицу — счётчики и статусы пересчитываются мгновенно. Клик по исполнителю на «Панели» открывает карточку. Код входа исполнитель использует на странице «Исполнитель».</div>'
 +'<div class="card"><div class="big" style="margin-bottom:10px">Табель часов</div>'+tbl+'</div>'
 +'<div class="card"><div class="big" style="margin-bottom:10px">Добавить исполнителя</div>'
 +'<div class="row"><label class="f">ФИО<input type="text" id="nName" placeholder="Иванов И. И."></label>'
 +'<label class="f">Телефон<input type="tel" id="nPhone" placeholder="+7 900 000-00-00"></label>'
 +'<label class="f">Платформа · заказчик<input type="text" id="nPlat" placeholder="Яндекс Смена · СтройПодряд"></label>'
 +'<button class="btn p" onclick="addExec()">Добавить</button></div></div>';
}
function setHours(id,m,v){const ex=S.executors.find(e=>e.id===id);if(!ex)return;
 if(v===''||v==null){delete ex.hours[m];}else ex.hours[m]=+v;
 jlog(ex.name+': часы '+label(m)+' = '+(v||'0')+' (введено заказчиком)');save();render();}
function addExec(){
 const n=$('#nName').value.trim(),p=$('#nPhone').value.trim(),pl=$('#nPlat').value.trim()||'без платформы';
 if(!n){toast('Укажите имя исполнителя');return;}
 S.executors.push({id:uid(),code:uid().slice(0,4),name:n,phone:p,platform:pl,payouts:{},hours:{}});
 jlog('Добавлен исполнитель '+n);save();render();toast('Исполнитель добавлен');}
function viewDetail(ex){
 const c=calcLink(ex),CM=curMonth();
 const months=monthWindow(8);
 const maxH=Math.max(80,...months.map(m=>+ex.hours[m]||0));
 const bars=months.map(m=>{const h=+ex.hours[m]||0;const over=h>S.settings.limit;
  return '<div><div class="c">'+(h||'–')+'</div><div class="b'+(over?' over':'')+'" style="height:'+Math.round(h/maxH*100)+'%"></div><div class="c">'+label(m)+'</div></div>';}).join('');
 const pr=payoutRisk(ex);
 const jr=S.journal.filter(j=>j.txt.indexOf(ex.name)>=0).slice(0,8).map(j=>'<div class="jr">'+new Date(j.ts).toLocaleString('ru-RU').slice(0,16)+' — '+j.txt+'</div>').join('')||'<div class="mut">записей нет</div>';
 const pay=months.map(m=>'<div style="text-align:center"><div class="mut" style="font-size:11px">'+label(m)+'</div><input type="number" min="0" step="500" style="width:70px" value="'+(ex.payouts[m]??'')+'" onchange="setPay(\''+ex.id+'\',\''+m+'\',this.value)"></div>').join('');
 return '<button class="btn g noprint" onclick="go(\'execs\')">← К списку</button> <button class="btn s noprint" onclick="window.print()">🖨 Досье в PDF (печать)</button><br><br>'
 +'<div class="card"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="big">'+ex.name+'</div>'+badge(c.status)
 +'<div class="mut">'+ex.platform+' · '+ex.phone+' · код <code>'+ex.code+'</code></div></div>'
 +'<div class="bar" style="margin-top:14px">'+bars+'</div>'
 +'<div><b>Серия: '+c.series+'/'+S.settings.seriesLen+'.</b> '+(c.forecast||'')+'</div>'
 +(c.resetMonth?'<div class="mut">Серия сбрасывалась в '+label(c.resetMonth)+' (месяц ≤ '+S.settings.limit+' ч).</div>':'')
 +(c.pausedUntil?'<div class="mut">Пауза действует до конца '+label(c.pausedUntil)+'.</div>':'')
 +'</div>'
 +'<div class="card"><div class="big" style="margin-bottom:8px">Выплаты по месяцам, ₽</div><div class="row">'+pay+'</div>'
 +(pr>=4?'<div class="alert yel" style="margin-top:10px"><span class="ic">📊</span><div>Индикатор дохода (приказ 657н): '+pr+' месяцев подряд выплаты ≥ 25 000 ₽. При 5 месяцах подряд — риск признания трудовых отношений. Держите месяц ниже порога или готовьте документы ГПХ.</div></div>':'')
 +'</div>'
 +'<div class="card"><div class="big" style="margin-bottom:8px">Журнал действий (досье осмотрительности)</div>'+jr+'</div>';
}
function setPay(id,m,v){const ex=S.executors.find(e=>e.id===id);if(!ex)return;
 if(v===''||v==null){delete ex.payouts[m];}else ex.payouts[m]=+v;jlog(ex.name+': выплата '+label(m)+' = '+(v||'0')+' ₽');save();render();}

/* ---------- страница исполнителя ---------- */
function viewExecPage(){
 if(!execCode)return '<div class="phone"><div class="ph-head">⏰ Часовой лимит</div><div class="ph-body">'
 +'<p>Введите код из приглашения вашего заказчика (или ссылку вида hr60.ru/i/<b>A7K2</b> — просто код).</p>'
 +'<div class="row"><input type="text" id="code" placeholder="Например, A7K2" style="flex:1;min-width:120px"><button class="btn p" onclick="enterCode()">Войти</button></div>'
 +'<p class="mut" style="margin-top:14px">Вход по номеру телефона не нужен: код выдаёт ваш заказчик. Данные видите только вы и он.</p></div></div>';
 const ex=S.executors.find(e=>e.code===execCode.toUpperCase());
 if(!ex){execCode=null;const v=viewExecPage();afterRender=()=>toast('Код не найден, попробуйте ещё раз');return v;}
 const c=calcLink(ex),CM=curMonth();
 const links=ex.platform.split('·').map(s=>s.trim());
 const hoursCur=ex.hours[CM];
 const advice={safe:'Всё под контролем. Если в этом месяце часов больше '+S.settings.limit+', следите за счётчиком.',
  warn:'Вы на '+c.series+'-м месяце подряд выше лимита. В декабре можно снизить нагрузку — один месяц до '+S.settings.limit+' ч сбрасывает счётчик.',
  crit:'Внимание: это '+c.series+'-й месяц подряд выше лимита. Если в декабре снова больше '+S.settings.limit+' ч — заказы от платформы приостановят на 2 месяца. Снизьте часы или предупредите заказчика.',
  triggered:'Лимит сработал. Заказы через платформу приостановлены на 2 месяца. Обсудите с заказчиком ГПД или другой формат работы.',
  paused:'Идёт пауза после срабатывания лимита. '+c.forecast+'.'};
 return '<div class="phone"><div class="ph-head">⏰ Часовой лимит · '+ex.name.split(' ')[0]+'</div><div class="ph-body">'
 +'<button class="btn g" style="width:100%;margin-bottom:12px" onclick="exitCode()">Выйти</button>'
 +'<div style="text-align:center;margin:8px 0">'+badge(c.status)+'</div>'
 +'<div style="text-align:center" class="mut">'+ex.platform+'</div>'
 +'<div style="text-align:center;margin:14px 0"><span class="big" style="font-size:44px">'+(c.series)+'</span><span class="mut"> / '+S.settings.seriesLen+' месяцев</span></div>'
 +'<div class="hint" style="margin-bottom:14px">'+advice[c.status]+'</div>'
 +'<label class="f">Часы за '+label(CM)+' у «'+(links[1]||links[0])+'»'
 +'<input type="number" min="0" max="400" value="'+(hoursCur??'')+'" id="execHours" style="width:100%;font-size:18px;text-align:center" placeholder="0"></label>'
 +'<button class="btn p" style="width:100%;margin-top:10px" onclick="saveExecHours(\''+ex.id+'\')">Отправить</button>'
 +(hoursCur!=null?'<p class="mut" style="margin-top:10px">Отправлено: '+hoursCur+' ч. Можно исправить до конца месяца.</p>':'')
 +'<p class="mut" style="margin-top:16px">Напоминание придёт SMS или пуши в начале каждого месяца. Отписаться: СТОП.</p>'
 +'</div></div>';
}
function enterCode(){const v=$('#code').value.trim();if(!v)return;execCode=v.toUpperCase();render();}
function exitCode(){execCode=null;render();}
function saveExecHours(id){const ex=S.executors.find(e=>e.id===id);const v=+$('#execHours').value||0;
 ex.hours[curMonth()]=v;jlog(ex.name+': часы '+label(curMonth())+' = '+v+' (введено исполнителем)');save();render();toast('Сохранено');}

/* ---------- калькулятор ---------- */
function viewCalc(){
 const CM=curMonth(),ms=monthWindow(6);
 const inputs=ms.map(m=>'<label class="f">'+label(m)+'<input type="number" id="c_'+m+'" min="0" max="400" placeholder="часы" style="width:90px"></label>').join('');
 return '<div class="hint">Публичный лид-магнит: самозанятый вводит свои часы по месяцам и узнаёт, когда сработает лимит. Внизу — перехват для заказчиков.</div>'
 +'<div class="card"><div class="big" style="margin-bottom:10px">Когда у меня сработает лимит 60/6?</div>'
 +'<div class="row">'+inputs+'</div>'
 +'<button class="btn p" style="margin-top:14px" onclick="calcPub()">Рассчитать</button>'
 +'<div id="calcRes" style="margin-top:14px"></div></div>';
}
function calcPub(){
 const ms=monthWindow(6),ex={hours:{}};
 ms.forEach(m=>{const v=$('#c_'+m).value;if(v!=='')ex.hours[m]=+v;});
 if(!Object.keys(ex.hours).length){toast('Введите часы хотя бы за один месяц');return;}
 const c=calcLink(ex);
 const a={safe:['✅','Лимит не угрожает.'],warn:['⚠️','Вы на '+c.series+'-м месяце подряд выше лимита. '],crit:['🚨','Срочно: '+c.series+'-й месяц подряд выше лимита. '],triggered:['⛔','Лимит сработал — платформа приостановит заказы на 2 месяца. '],paused:['⏸','Идёт пауза после срабатывания. ']};
 let cls={safe:'yel',warn:'yel',crit:'red',triggered:'red',paused:'yel'}[c.status];
 let out='<div class="alert '+cls+'"><span class="ic">'+a[c.status][0]+'</span><div><b>'+a[c.status][1]+'</b> '+(c.forecast?c.forecast.charAt(0).toUpperCase()+c.forecast.slice(1)+'.':'')+'<br>Один месяц с ≤ '+S.settings.limit+' часами сбрасывает счётчик на ноль.<br><br><b>Вы заказчик?</b> Нужна панель по всем исполнителям сразу — напишите нам, подключим пилот бесплатно.</div></div>';
 $('#calcRes').innerHTML=out;jlog('Калькулятор: расчёт для '+c.series+'/'+S.settings.seriesLen+' ('+c.status+')');}

/* ---------- настройки ---------- */
function viewSet(){
 return '<div class="hint">Параметры расчёта соответствуют постановлению № 760 (лимит 60 часов, серия 6 месяцев подряд, пауза 2 месяца). Для пилотов менять не нужно — но сервис позволяет.</div>'
 +'<div class="card"><div class="big" style="margin-bottom:10px">Параметры лимита</div><div class="row">'
 +'<label class="f">Лимит часов в месяц<input type="number" id="sLim" value="'+S.settings.limit+'" style="width:90px"></label>'
 +'<label class="f">Длина серии, мес<input type="number" id="sLen" value="'+S.settings.seriesLen+'" style="width:90px"></label>'
 +'<label class="f">Пауза после срабатывания, мес<input type="number" id="sPause" value="'+S.settings.pauseMonths+'" style="width:90px"></label>'
 +'<button class="btn p" onclick="saveSet()">Сохранить</button></div></div>'
 +'<div class="card"><div class="big" style="margin-bottom:10px">Данные</div>'
 +'<button class="btn s" onclick="exportCSV()">⬇ Экспорт CSV (для 1С / Excel)</button> '
 +'<button class="btn g" onclick="if(confirm(\'Сбросить всё к демо-данным?\')){seed();render();toast(\'Демо-данные восстановлены\')}">Сбросить к демо</button></div>'
 +'<div class="card"><div class="big" style="margin-bottom:10px">Журнал</div>'
 +S.journal.slice(0,15).map(j=>'<div class="jr">'+new Date(j.ts).toLocaleString('ru-RU')+' — '+j.txt+'</div>').join('')+'</div>';
}
function saveSet(){S.settings.limit=+$('#sLim').value||60;S.settings.seriesLen=+$('#sLen').value||6;S.settings.pauseMonths=+$('#sPause').value||2;jlog('Изменены параметры расчёта');save();render();toast('Сохранено');}
function exportCSV(){
 const head=['Исполнитель','Телефон','Платформа · заказчик','Код'].concat(monthWindow(8).map(label),['Серия','Статус','Прогноз']);
 const rows=S.executors.map(ex=>{const c=calcLink(ex);
  return [ex.name,ex.phone,ex.platform,ex.code].concat(monthWindow(8).map(m=>ex.hours[m]??''),[c.series+'/'+S.settings.seriesLen,STATUS[c.status].t,c.forecast||'']);});
 const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='hr60_'+curMonth()+'.csv';a.click();
 jlog('Экспорт CSV реестра');}

/* ---------- старт ---------- */
load();renderNav();render();
</script></body></html>
