<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Норма — счётчик часов 60/6</title>
<style>
:root{
 --bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--mut:#64748b;--line:#e8edf4;
 --acc:#4f46e5;--acc2:#7c3aed;--acc-soft:#eef2ff;--acc-line:#c7d2fe;
 --ok:#059669;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fffbeb;
 --bad:#dc2626;--bad-bg:#fef2f2;--pause:#64748b;--pause-bg:#f1f5f9;
 --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.06);
 --r:14px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
body::before{content:'';display:block;height:4px;background:linear-gradient(90deg,#4f46e5,#7c3aed,#0ea5e9)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:19px;font-weight:800;letter-spacing:-.02em}
.logo .dot{color:var(--acc)}
.tag606{background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc-line);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.demo{background:#f1f5f9;border-radius:99px;padding:3px 10px;font-size:12px;color:#64748b}
.note{margin-left:auto;font-size:12px;color:#94a3b8}
nav{display:flex;gap:6px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
nav button{border:1px solid transparent;background:none;padding:8px 15px;border-radius:99px;cursor:pointer;font-size:14px;color:var(--mut)}
nav button.on{background:var(--acc-soft);color:var(--acc);font-weight:700;border-color:var(--acc-line)}
main{max-width:1100px;margin:22px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kpi{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--mut)}
.badge{display:inline-block;padding:5px 13px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:9px 6px;border-bottom:2px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:center}
td input{width:54px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;text-align:right;font:inherit}
td input:focus{outline:2px solid var(--acc-line);border-color:var(--acc)}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.btn.p{background:var(--acc);color:#fff;box-shadow:0 2px 6px rgba(79,70,229,.3)}
.btn.p:hover{background:#4338ca}
.btn.s{background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc-line)}
.btn.g{background:#f1f5f9;color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--bad-bg);color:var(--bad);border:1px solid #fecaca}
.btn:hover{filter:brightness(.97)}
input[type=text],input[type=tel],input[type=number],select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus{outline:2px solid var(--acc-line);border-color:var(--acc)}
.bar{display:flex;align-items:flex-end;gap:6px;height:130px;margin:12px 0}
.bar>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar .b{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#818cf8,#6366f1);min-height:3px}
.bar .b.over{background:linear-gradient(180deg,#f87171,#dc2626)}
.bar .c{font-size:11px;color:var(--mut)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:12px;margin-bottom:10px;font-size:14px}
.alert.red{background:var(--bad-bg);border:1px solid #fecaca}
.alert.yel{background:var(--warn-bg);border:1px solid #fde68a}
.alert.grn{background:var(--ok-bg);border:1px solid #bbf7d0}
.alert .ic{font-size:18px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:600}
.jr{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:99;box-shadow:0 8px 24px rgba(15,23,42,.3)}
#toast.on{opacity:1}
.big{font-size:20px;font-weight:800;letter-spacing:-.01em}
.phone{max-width:360px;margin:0 auto;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 12px 34px rgba(15,23,42,.12)}
.phone .ph-head{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:16px 18px;font-weight:800}
.phone .ph-body{padding:16px}
.hint{background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:12px;padding:11px 15px;font-size:13px;color:#3730a3;margin-bottom:14px}
code{background:#f1f5f9;padding:2px 7px;border-radius:6px;font-size:.92em}
.ring{width:150px;height:150px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center}
.ring .in{width:110px;height:110px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .in b{font-size:30px;letter-spacing:-.02em}
.hero{text-align:center;padding:34px 16px 22px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
.hero p{color:var(--mut);font-size:15.5px;margin:0 auto 20px;max-width:460px}
.foot{color:var(--mut);font-size:12.5px;text-align:center;margin:26px 0 6px}
.foot b{color:var(--ink)}
@media print{header,nav,.btn,#toast,.noprint,body::before{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}

/* ---------- мобильная адаптация v2 ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.tw table{min-width:680px}
.tw th,.tw td:first-child{white-space:nowrap}
@media(max-width:800px){
 nav{flex-wrap:nowrap;overflow-x:auto;padding:10px;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 nav::-webkit-scrollbar{display:none}
 nav button{flex:0 0 auto;white-space:nowrap;padding:9px 14px;font-size:14px}
 main{margin:14px auto;padding:0 10px}
 .card{padding:14px}
 .kpi{min-width:calc(50% - 7px)}
 .kpi .n{font-size:23px}
 td input,input[type=text],input[type=tel],input[type=number],select{font-size:16px}
 table{font-size:13px}
 .tw td:first-child,.tw th:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line)}
 .phone{max-width:100%;border:0;border-radius:0;box-shadow:none}
 header{padding:10px 12px}
 .note{display:none}
 .hero h1{font-size:24px}
 .btn{padding:12px 18px}
}

/* ---------- QR-модалка ---------- */
.qr-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.qr-box{background:#fff;border-radius:16px;padding:20px;max-width:330px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(15,23,42,.3)}
.qr-box img{width:220px;height:220px;border:1px solid var(--line);border-radius:10px;margin:12px 0;background:#fff}
</style></head><body>
<header><span class="logo">Норма<span class="dot">.</span></span> <span class="tag606">счётчик 60/6</span> <span class="demo">демо-данные</span>
<span class="note">данные хранятся локально в этом браузере</span></header>
<nav id="nav"></nav><main id="view"></main><div id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const MONTHS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function addMonths(k,n){const[y,m]=k.split('-').map(Number);let M=m-1+n;const Y=y+Math.floor(M/12);M=((M%12)+12)%12;return Y+'-'+String(M+1).padStart(2,'0');}
function label(k){const[y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+String(y).slice(2);}
function curMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthWindow(n){const CM=curMonth();const a=[];for(let i=n-1;i>=0;i--)a.push(addMonths(CM,-i));return a;}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}
const STATUS={
 safe:{t:'Безопасно',fg:'#047857',bg:'#d1fae5'},
 warn:{t:'Внимание',fg:'#b45309',bg:'#fef3c7'},
 crit:{t:'На грани',fg:'#b91c1c',bg:'#fee2e2'},
 triggered:{t:'Лимит сработал',fg:'#991b1b',bg:'#fecaca'},
 paused:{t:'Пауза 60/6',fg:'#475569',bg:'#e2e8f0'}};
function badge(st){const s=STATUS[st];return '<span class="badge" style="color:'+s.fg+';background:'+s.bg+'">'+s.t+'</span>';}
function suspMark(ex){return ex.suspended?' <span class="badge" style="color:#991b1b;background:#fee2e2" title="Фактическая приостановка отмечена вручную">факт: пауза</span>':'';}

/* ---------- приглашения (самодостаточная ссылка со снимком профиля) ---------- */
function encPayload(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function decPayload(s){try{let t=s.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return JSON.parse(decodeURIComponent(escape(atob(t))));}catch(e){return null;}}
function inviteLink(ex){
 const months=monthWindow(8);
 const payload={v:2,c:ex.code,n:ex.name,t:ex.phone||'',p:ex.platform||'',s:!!ex.suspended,h:{},py:{}};
 months.forEach(m=>{if(ex.hours[m]!=null&&ex.hours[m]!=='')payload.h[m]=+ex.hours[m];});
 months.forEach(m=>{if(ex.payouts[m]!=null&&ex.payouts[m]!=='')payload.py[m]=+ex.payouts[m];});
 return location.origin+location.pathname+'#p='+encPayload(payload);}
function inviteMsg(ex){return 'Приглашение в «Норма» — счётчик часов 60/6 для самозанятых.\n\nВаш заказчик добавил вас в панель. Откройте ссылку — она сразу покажет ваш счётчик:\n'+inviteLink(ex)+'\n\nИли на странице «Исполнитель» введите код: '+ex.code;}
function copyText(t,ok){const done=()=>toast(ok||'Скопировано');
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallback(t,done));}else fallback(t,done);}
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();done();}
function copyInvite(ex){copyText(inviteMsg(ex),'Приглашение скопировано — вставьте в переписку');jlog(ex.name+': текст приглашения скопирован');}
function openWA(ex){window.open('https://wa.me/?text='+encodeURIComponent(inviteMsg(ex)),'_blank');jlog(ex.name+': приглашение отправлено через WhatsApp');}
function openTG(ex){window.open('https://t.me/share/url?url='+encodeURIComponent(inviteLink(ex))+'&text='+encodeURIComponent('Приглашение в «Норма» · ваш код: '+ex.code),'_blank');jlog(ex.name+': приглашение отправлено через Telegram');}
function openMAX(ex){window.open('https://max.ru/:share?text='+encodeURIComponent(inviteMsg(ex)),'_blank');jlog(ex.name+': приглашение отправлено через MAX');}

/* ---------- QR-код ---------- */
function closeQR(){const e=document.getElementById('qrOv');if(e)e.remove();}
function showQR(ex){
 const old=document.getElementById('qrOv');if(old)old.remove();
 const ov=document.createElement('div');ov.id='qrOv';ov.className='qr-ov';
 ov.onclick=function(e){if(e.target===ov)closeQR();};
 ov.innerHTML='<div class="qr-box"><div class="big">QR-код приглашения</div>'
 +'<div class="mut">'+ex.name+' · код '+ex.code+'</div>'
 +'<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=6&data='+encodeURIComponent(inviteLink(ex))+'" alt="QR-код">'
 +'<div class="mut" style="margin-top:8px">Наведите камеру телефона — откроется персональный счётчик. Картинку можно сохранить: удерживайте палец и выберите «Сохранить».</div>'
 +'<div class="row" style="justify-content:center;margin-top:14px"><button class="btn s" onclick="copyInvite(S.executors.find(e=>e.id===\''+ex.id+'\'))">Копировать приглашение</button><button class="btn g" onclick="closeQR()">Закрыть</button></div></div>';
 document.body.appendChild(ov);
}

/* ---------- состояние ---------- */
const KEY='hr60_v1';
const DEF={limit:60,seriesLen:6,pauseMonths:2};
let S=null;
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function uid(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function seed(){
 const CM=curMonth(),M=n=>addMonths(CM,n);
 const mk=(a,b,c,d,e,f,g,h)=>({[M(-7)]:a||'',[M(-6)]:b||'',[M(-5)]:c||'',[M(-4)]:d||'',[M(-3)]:e||'',[M(-2)]:f||'',[M(-1)]:g||'',[M(0)]:h||''});
 S={version:1,settings:{...DEF},journal:[],executors:[
  {id:uid(),code:'A7K2',name:'Иванов И. И.',phone:'+7 911 100-11-22',platform:'Яндекс Смена · СтройПодряд',suspended:false,payouts:mk(42000,45000,48000,46000,47000,44000,41000),hours:mk(48,66,68,70,65,64,61,'')},
  {id:uid(),code:'M3P9',name:'Петрова А. С.',phone:'+7 911 100-33-44',platform:'Авито Подработки · СтройПодряд',suspended:false,payouts:mk(38000,39500,41000,40000,40500,39000,38500),hours:mk(30,55,55,65,64,66,62,63)},
  {id:uid(),code:'K4T8',name:'Козлова М. В.',phone:'+7 911 100-55-66',platform:'КлинингПро · Клининг',suspended:false,payouts:mk(28000,31000,30000,12000,22000,26000,25000),hours:mk(52,64,66,40,62,63,64,65)},
  {id:uid(),code:'D1R6',name:'Сидоров П. Н.',phone:'+7 911 100-77-88',platform:'Яндекс Смена · Склад №2',suspended:false,payouts:mk(21000,22000,23000,21000,24000,22000,23000),hours:mk(44,50,48,52,55,50,54,48)},
  {id:uid(),code:'V8L2',name:'Кузнецов Д. А.',phone:'+7 911 100-99-00',platform:'Доставка Еда · Общепит',suspended:false,payouts:mk(18000,19000,25000,27000,26000,25500,26500),hours:mk(38,40,66,70,64,71,0,66)} ],
  journal:[{ts:new Date().toISOString(),txt:'Загружены демо-данные (5 исполнителей)'}]};
 save();}
function load(){try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null;}if(!S||!S.executors)seed();}
function jlog(txt){S.journal.unshift({ts:new Date().toISOString(),txt});if(S.journal.length>200)S.journal.length=200;save();}

/* ---------- расчётное ядро 60/6 (проверено на граничных кейсах) ---------- */
function calcLink(ex){
 const Sx=S.settings;
 const months=Object.keys(ex.hours||{}).sort();
 const r={series:0,status:'safe',triggerMonth:null,pausedUntil:null,resetMonth:null,forecast:null};
 if(!months.length)return r;
 let series=0,pauseUntil=null,triggeredMonth=null;
 for(const m of months){
  if(pauseUntil){if(m<=pauseUntil)continue;pauseUntil=null;series=0;}
  const h=+ex.hours[m]||0;
  if(h>Sx.limit){series++;
   if(series>=Sx.seriesLen){triggeredMonth=m;pauseUntil=addMonths(m,Sx.pauseMonths);series=0;}
  }else{series=0;r.resetMonth=m;}
 }
 r.series=series;r.triggerMonth=triggeredMonth;r.pausedUntil=pauseUntil;
 const cur=months[months.length-1],hcur=+ex.hours[cur]||0;
 if(pauseUntil){
  r.status=triggeredMonth===cur?'triggered':'paused';
  r.forecast='расчёт возобновится с '+label(addMonths(pauseUntil,1));
 }else if(series>=Sx.seriesLen-1){
  r.status='crit';r.forecast='при темпе >'+Sx.limit+' ч сработает в '+label(addMonths(cur,1));
 }else if(series>=Sx.seriesLen-2){
  r.status='warn';
  r.forecast='при темпе >'+Sx.limit+' ч сработает в '+label(addMonths(cur,Sx.seriesLen-series));
 }else{
  r.status='safe';
  r.forecast=hcur>Sx.limit?('при темпе >'+Sx.limit+' ч сработает в '+label(addMonths(cur,Sx.seriesLen-series))):'риска нет';
 }
 return r;}
function payoutRisk(ex){
 const months=Object.keys(ex.payouts||{}).sort();let s=0,best=0;
 for(const m of months){const p=+ex.payouts[m]||0;if(p>=25000){s++;if(s>best)best=s;}else s=0;}
 return best;}
function remainTxt(ex){
 const CM=curMonth();if(ex.hours[CM]==null||ex.hours[CM]==='')return null;
 const h=+ex.hours[CM]||0,left=S.settings.limit-h;
 return left>=0?('Израсходовано '+h+' ч — до лимита осталось '+left+' ч.')
  :('Лимит превышен на '+(-left)+' ч — счётчик серии идёт.');}
const RANK={triggered:0,paused:1,crit:2,warn:3,safe:4};

/* ---------- навигация ---------- */
const TABS=[['dash','Панель'],['execs','Исполнители'],['exec','Страница исполнителя'],['calc','Калькулятор'],['set','Настройки']];
let tab='dash',openId=null,execCode=null;
function renderNav(){
 $('#nav').innerHTML=TABS.map(t=>'<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('');}
function go(t,arg){tab=t;openId=(arg!==undefined?arg:null);renderNav();render();}
function render(){
 const v=$('#view');
 if(tab==='dash')v.innerHTML=viewDash();
 else if(tab==='execs')v.innerHTML=viewExecs();
 else if(tab==='exec')v.innerHTML=viewExecPage();
 else if(tab==='calc')v.innerHTML=viewCalc();
 else v.innerHTML=viewSet();
 const h=typeof afterRender==='function'?afterRender:null;afterRender=null;if(h)h();}
let afterRender=null;

/* ---------- панель заказчика ---------- */
function viewDash(){
 const CM=curMonth();
 const rows=S.executors.map(ex=>({ex,c:calcLink(ex)}));
 rows.sort((a,b)=>RANK[a.c.status]-RANK[b.c.status]||b.c.series-a.c.series);
 const cnt={safe:0,warn:0,crit:0,triggered:0,paused:0};rows.forEach(r=>cnt[r.c.status]++);
 let alerts='';
 rows.forEach(r=>{const c=r.c;
  if(c.status==='crit')alerts+='<div class="alert red"><span class="ic">🚨</span><div><b>'+r.ex.name+'</b> — '+c.series+'-й месяц подряд выше лимита. При текущем темпе приостановка в '+label(addMonths(CM,1))+'. Рекомендация: снизить часы в '+label(CM).replace(' '+CM.slice(2),'')+' или распределить по другому заказчику.</div></div>';
  if(c.status==='warn')alerts+='<div class="alert yel"><span class="ic">⚠️</span><div><b>'+r.ex.name+'</b> — '+c.series+'-й месяц подряд. '+c.forecast+'. Пора готовить план на '+label(addMonths(CM,1))+'.</div></div>';
  if(c.status==='triggered')alerts+='<div class="alert red"><span class="ic">⛔</span><div><b>'+r.ex.name+'</b> — лимит сработал в '+label(CM)+'. Пауза 2 месяца, заказы через платформу приостановлены. Варианты: перераспределить объём, оформить ГПД напрямую, взять объём на себя.</div></div>';
  if(r.ex.suspended&&c.status!=='triggered'&&c.status!=='paused')alerts+='<div class="alert yel"><span class="ic">⛔</span><div><b>'+r.ex.name+'</b> — отмечена фактическая приостановка платформой (вручную). Расчётный статус: '+STATUS[c.status].t+'.</div></div>';
 });
 const tbl='<table><tr><th>Исполнитель</th><th>Платформа · заказчик</th>'+monthWindow(8).map(m=>'<th class="num">'+label(m)+'</th>').join('')+'<th>Серия</th><th>Статус</th><th>Прогноз</th></tr>'

/* ---------- калькулятор-витрина ---------- */
function viewCalc(){
 const CM=curMonth(),ms=monthWindow(6);
 const inputs=ms.map(m=>'<label class="f">'+label(m)+'<input type="number" id="c_'+m+'" min="0" max="400" placeholder="часы" style="width:90px"></label>').join('');
 return '<div class="card hero">'
 +'<h1>Сколько осталось до лимита 60/6?</h1>'
 +'<p>Платформа приостановит заказы, если 6 месяцев подряд вы работали больше 60 часов в месяц. Введите свои часы — калькулятор покажет, когда это случится.</p>'
 +'<div class="row" style="justify-content:center">'+inputs+'</div>'
 +'<button class="btn p" style="margin-top:16px" onclick="calcPub()">Рассчитать</button>'
 +'<div id="calcRes" style="margin-top:18px"></div></div>'
 +'<div class="foot"><b>Норма</b> — счётчик часов 60/6 для самозанятых и их заказчиков. Данные не покидают ваш браузер.</div>';
}
function calcPub(){
 const ms=monthWindow(6),ex={hours:{}};
 ms.forEach(m=>{const v=$('#c_'+m).value;if(v!=='')ex.hours[m]=+v;});
 if(!Object.keys(ex.hours).length){toast('Введите часы хотя бы за один месяц');return;}
 const c=calcLink(ex);
 const heads={safe:['✅','Лимит не угрожает'],warn:['⚠️','Счётчик уже идёт'],crit:['🚨','До приостановки один шаг'],triggered:['⛔','Лимит сработал'],paused:['⏸','Идёт пауза']};
 const H=heads[c.status];
 const pct=Math.min(100,Math.round(c.series/S.settings.seriesLen*100));
 let ring='';
 if(c.series>0&&!c.pausedUntil){
  ring='<div class="ring" style="background:conic-gradient(var(--acc) '+pct+'%, var(--line) 0)"><div class="in"><b>'+c.series+'</b><span class="mut">из '+S.settings.seriesLen+' мес. подряд</span></div></div>';
 }
 let cls={safe:'grn',warn:'yel',crit:'red',triggered:'red',paused:'yel'}[c.status];
 let out=ring+'<div class="alert '+cls+'" style="margin-top:'+(ring?'16px':'0')+'"><span class="ic">'+H[0]+'</span><div><b>'+H[1]+'.</b> '
 +(c.forecast?c.forecast.charAt(0).toUpperCase()+c.forecast.slice(1)+'.<br>':'')
 +'Один месяц с ≤ '+S.settings.limit+' часами сбрасывает счётчик на ноль.<br><br><b>Вы заказчик?</b> Нужна панель по всем исполнителям сразу — напишите нам, подключим пилот бесплатно.</div></div>';
 $('#calcRes').innerHTML=out;jlog('Калькулятор: расчёт для '+c.series+'/'+S.settings.seriesLen+' ('+c.status+')');}

function exportCSV(){

 const rows=S.executors.map(ex=>{const c=calcLink(ex);
  return [ex.name,ex.phone,ex.platform,ex.code].concat(monthWindow(8).map(m=>ex.hours[m]??''),[c.series+'/'+S.settings.seriesLen,STATUS[c.status].t,c.forecast||'']);});
 const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='norma_'+curMonth()+'.csv';a.click();
 jlog('Экспорт CSV реестра');}
function exportJSON(){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
 a.download='norma_backup_'+curMonth()+'.json';a.click();jlog('Сохранена резервная копия');toast('Копия скачана');}
function importJSON(inp){const f=inp.files&&inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=function(){let d=null;try{d=JSON.parse(r.result);}catch(e){}
  if(!d||!d.executors||!Array.isArray(d.executors)){toast('Файл не похож на копию «Нормы»');inp.value='';return;}
  if(!confirm('Восстановить копию от '+new Date(d.journal&&d.journal[0]?d.journal[0].ts:Date.now()).toLocaleDateString('ru-RU')+'? Текущие данные будут заменены ('+S.executors.length+' → '+d.executors.length+' исп.).')){inp.value='';return;}
  S=d;jlog('Восстановлено из резервной копии ('+S.executors.length+' исполнителей)');save();render();toast('Данные восстановлены');inp.value='';};
 r.readAsText(f);}

/* ---------- старт: разбор ссылки ---------- */
load();
(function(){
 const h=(location.hash||'').replace(/^#/,'').trim();
 if(!h)return;
 if(h.indexOf('p=')===0){
  const d=decPayload(h.slice(2));
  if(d&&d.c){
   const code=String(d.c).toUpperCase();
   let ex=S.executors.find(e=>e.code===code);
   if(!ex){
    ex={id:uid(),code:code,name:d.n||'Исполнитель',phone:d.t||'',platform:d.p||'без платформы',suspended:!!d.s,payouts:d.py||{},hours:d.h||{},guest:true};
    S.executors.push(ex);
    jlog('Исполнитель добавлен по пригласительной ссылке: '+ex.name);save();
   }
   execCode=code;tab='exec';return;
  }
 }
 const code=h.toUpperCase();
 if(S.executors.some(e=>e.code===code)){execCode=code;tab='exec';}
})();
renderNav();render();
</script><script>
/* ---------- обёртка таблиц для горизонтальной прокрутки ---------- */
(function(){
 function wrap(){
  document.querySelectorAll('#view table').forEach(function(t){
   if(t.parentElement && t.parentElement.classList.contains('tw'))return;
   var d=document.createElement('div');d.className='tw';
   t.parentNode.insertBefore(d,t);d.appendChild(t);
  });
 }
 var v=document.getElementById('view');
 if(v){new MutationObserver(wrap).observe(v,{childList:true,subtree:true});wrap();}
})();
</script>
